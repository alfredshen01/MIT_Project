services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: mit_project
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /data/files
    ports:
      - "8000:8000"
    volumes:
      - file-data:/data/files
    depends_on:
      - db
    networks:
      - app-network

  web:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - api
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

networks:
  app-network:

volumes:
  db-data:
  file-data:
  certbot-www:
  certbot-certs:
